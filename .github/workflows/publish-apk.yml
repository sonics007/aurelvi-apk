name: Publish signed APK
on:
  push:
    branches: [main]
    paths: ["dist/**", "release.json", ".github/workflows/publish-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish binary release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const meta = JSON.parse(fs.readFileSync('release.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(meta.version) || meta.file !== `Aurelvi-${meta.version}.apk`) {
              throw new Error('Version and APK filename must match');
            }
            if (meta.package !== 'sk.openpanel.nspanel' || !Number.isInteger(meta.versionCode) || meta.versionCode < 5) {
              throw new Error('Unexpected package or versionCode');
            }
            const apk = fs.readFileSync(`dist/${meta.file}`);
            const digest = crypto.createHash('sha256').update(apk).digest('hex');
            if (digest !== meta.sha256 || apk.length < 10000 || apk.length > 100 * 1024 * 1024 || apk.readUInt32LE(0) !== 0x04034b50) {
              throw new Error('APK integrity check failed');
            }
            const sums = fs.readFileSync('SHA256SUMS.txt', 'utf8').split('\n').map(l => l.trim()).filter(Boolean);
            if (!sums.includes(`${digest}  ${meta.file}`)) {
              throw new Error(`SHA256SUMS.txt must contain "${digest}  ${meta.file}"`);
            }
            const {owner, repo} = context.repo;
            const tag = `v${meta.version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const existing = releases.find(r => r.tag_name === tag);
            if (existing && !existing.draft) {
              const asset = existing.assets.find(a => a.name === meta.file);
              if (!asset || asset.size !== apk.length || asset.digest !== `sha256:${digest}`) {
                throw new Error('Published version exists with different or unverifiable APK; bump version');
              }
              core.notice(`Release ${tag} already published with matching APK`);
              return;
            }
            const body = `Aurelvi Android app ${meta.version}\n\nPackage: ${meta.package}\nversionCode: ${meta.versionCode}\nMinimum Android: 8.0\n\n${meta.notes || 'Community build. Test on your panel before relying on it.'}\n\nInstall with adb install -r. Keep the existing signing certificate. Android confirmation is required for in-app updates.\n\nSHA-256: ${digest}\n\nAndroid source and signing key are not included in this repository.`;
            const release = existing || (await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: context.sha, name: `Aurelvi ${meta.version}`, body, draft: true, prerelease: false})).data;
            for (const asset of release.assets || []) {
              if ([meta.file, 'SHA256SUMS.txt'].includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: asset.id});
              }
            }
            await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name: meta.file, data: apk, headers: {'content-type': 'application/vnd.android.package-archive', 'content-length': apk.length}});
            const checksum = Buffer.from(`${digest}  ${meta.file}\n`);
            await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name: 'SHA256SUMS.txt', data: checksum, headers: {'content-type': 'text/plain', 'content-length': checksum.length}});
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, body, draft: false, prerelease: false, make_latest: 'true'});
            core.notice(`Published ${tag}`);
